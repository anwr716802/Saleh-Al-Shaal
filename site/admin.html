<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة إدارة — الشهيد صالح سالم الشعب</title><link rel="stylesheet" href="styles.css"><script defer src="config.js"></script><script defer src="admin.js"></script></head><body class="admin-page"><main class="admin"><section id="login" class="panel"><h1>لوحة الإدارة</h1><p>هذه الصفحة خاصة بمالك الموقع.</p><form id="loginForm"><input id="token" type="password" placeholder="ADMIN_TOKEN" required><button class="btn primary" type="submit">دخول</button><p id="loginMsg"></p></form></section><section id="panel" class="panel" hidden><div class="admin-top"><h1>إدارة المحتوى</h1><button id="logout" class="btn">خروج</button></div><form id="profileForm"><h2>المعلومات الأساسية</h2><div class="form-grid"><label>الاسم<input name="name"></label><label>المكان<input name="location"></label><label>العنوان القصير<input name="tagline"></label><label>رابط الصورة الرئيسية<input name="hero_image"></label><label>الميلاد<input name="birth"></label><label>الوفاة<input name="death"></label><label>العمل<input name="job"></label><label>تاريخ الاستشهاد<input name="martyrdomDate"></label><label>مكان الاستشهاد<input name="martyrdomPlace"></label></div><label>مقدمة<textarea name="intro"></textarea></label><label>النبذة<textarea name="bio"></textarea></label><label>القصة<textarea name="story"></textarea></label><label>يوم الاستشهاد<textarea name="departure"></textarea></label><label>رسالة الابن<textarea name="sonLetter"></textarea></label><button class="btn primary" type="submit">حفظ المعلومات</button><p id="saveMsg"></p></form><hr><h2>ذكريات الناس</h2><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>العلاقة</th><th>العنوان</th><th>الذكرى</th><th>الحالة</th><th>تغيير</th></tr></thead><tbody id="memoriesTable"></tbody></table></div><p class="admin-note">إدارة المحطات والمواقف والصور والأقوال والأعمال تتم من Google Sheets مباشرة، بينما هذه الصفحة مخصصة للمعلومات الأساسية ومراجعة الذكريات.</p></section></main></body></html>
